<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(montserrat-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:M;src:url(montserrat-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:M;src:url(montserrat-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:M;src:url(montserrat-latin-700-normal.woff2);font-weight:700}
/* токены из библиотеки Sweed (flow.fig) */
:root{--ink:#12130f;--i50:rgba(18,19,15,.5);--i30:rgba(18,19,15,.3);--i10:rgba(18,19,15,.1);--i5:rgba(18,19,15,.05);
 --teal:#1d7874;--line:#e8e8e7;--canvas:#f3f3f3;--yellow:#ffbf00;--green:#5bba6f;--red:#ed254e;
 --audience:#5bba6f;--delay:#06aed5;--action:#c200fb;--split:#f67227;
 --ai:#a682ff;--aiT:rgba(166,130,255,.09);--aiB:rgba(166,130,255,.45)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:898.56px;position:relative;overflow:hidden;font:500 12px/16px M,sans-serif;color:var(--ink);background:#fff}
.abs{position:absolute}
/* оболочка портала: продовые сайдбар и топлайн, как в остальных роликах */
.sb{left:0;top:0;width:220px;height:899px;background:#04465e url(sidebar.png) no-repeat 0 0/220px auto}
.sb .fix{position:absolute;left:0;width:220px;height:32px;line-height:46px;overflow:hidden;padding-left:48px;font:400 13px/32px M;color:#fff}
.top{left:220px;top:0;width:1220px;height:56px;background:#f3f3f3 url(topbar.png) no-repeat 0 0/1220px 56px}
/* header / block */
.ib40{width:40px;height:40px;border-radius:8px;background:var(--i5);display:grid;place-items:center}
.crumb{left:316px;top:68px;color:#5bba6f}.crumb i{font-style:normal;color:var(--i30);margin:0 4px}
h1{position:absolute;left:316px;top:84px;font:700 24px/32px M}
.tabs{left:260px;top:128px;display:flex;height:32px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#f3f3f3}
.tabs span{padding:0 15px;font:500 14px/30px M;border-left:1px solid var(--line)}.tabs span:first-child{border:0}.tabs .on{background:var(--yellow)}
.sep{left:260px;top:176px;width:1140px;height:4px;border-radius:2px;background:var(--i5)}
/* рабочая область: канвас + правая панель */
.work{left:260px;top:196px;width:1140px;height:623px;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex}
.canvas{flex:1;background:var(--canvas);position:relative}
.panel{width:440px;background:#fff;border-left:1px solid var(--line);position:relative;padding:0 24px}
/* ноды */
.node{position:absolute;width:144px;background:#fff;border-radius:8px}
.node .h{height:24px;border-radius:8px 8px 0 0;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.node .h svg{width:12px;height:12px}
.node .r{border:1px solid;border-top:0;padding:8px;min-height:32px}.node .r:last-child{border-radius:0 0 8px 8px}
.node .r .k{color:var(--i50)}
.fb{position:absolute;left:0;width:144px;height:8px;border-radius:8px}
.plus{position:absolute;width:24px;height:24px;border-radius:8px;background:var(--i5);display:grid;place-items:center}
.ab{font:600 10px/16px M;background:rgba(255,255,255,.25);border-radius:4px;padding:0 5px}
/* форма */
.h2{height:60px;position:relative;display:flex;align-items:center;justify-content:space-between}
.h2 b{font:700 16px/20px M;display:flex;align-items:center;gap:8px}
.h2:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:var(--i5)}
.lbl{color:var(--teal);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.help{width:16px;height:16px;border-radius:50%;background:var(--i5);color:var(--i50);font:700 10px/16px M;text-align:center}
.inp{height:32px;border:1px solid var(--i10);border-radius:8px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:#fff}
.inp.ph{color:var(--i30)}
.row{display:flex;gap:16px}.row>*{flex:1;min-width:0}
.f{margin-top:16px}
.cb{display:flex;align-items:center;gap:8px;color:var(--teal)}
.cbx{width:16px;height:16px;border-radius:4px;background:var(--teal);display:grid;place-items:center}
.cbx.off{background:#fff;box-shadow:inset 0 0 0 1px var(--i30)}
.btn.aib{background:var(--ai);color:#fff;box-shadow:0 4px 12px rgba(166,130,255,.35)}.btn{height:32px;border-radius:8px;background:var(--i5);display:inline-flex;align-items:center;gap:8px;padding:0 12px;font:700 12px/16px M;white-space:nowrap}
.sh{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}
.sh b{font:700 14px/20px M}
/* таблица */
.tb{border-radius:4px;overflow:hidden}
.tb .tr{display:grid;align-items:center;min-height:44px;padding:6px 12px;gap:8px;border-bottom:1px solid var(--line)}
.tb .th{background:var(--ink);color:#fff;min-height:32px;border:0}
.tb .tr>span{min-width:0}.tb .s{color:var(--i50);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{display:inline-block;font:500 10px/16px M;border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:1px}
.bd.def{background:var(--i5);color:var(--i50)}
.bd.ai{background:var(--ai);color:#fff}
.bd.win{background:var(--yellow);color:var(--ink)}
/* AI */
.spk{width:16px;height:16px;flex:none}
.aic{background:var(--aiT);box-shadow:inset 0 0 0 1px var(--aiB);border-radius:8px;padding:14px 16px;display:flex;gap:10px;line-height:18px}
.aic .t{font-weight:700}
.lk{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:rgba(18,19,15,.35);text-underline-offset:3px}
/* блок кнопок снизу */
.bb{left:260px;top:835px;width:1140px;display:flex;justify-content:center;gap:8px}
.bb .b{height:40px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 12px;font:700 14px/16px M;min-width:200px}
.bb .g{background:var(--i5)}
.bb .p{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(29,120,116,.25)}.bb .ai{background:var(--ai);color:#fff;box-shadow:0 4px 12px rgba(166,130,255,.35)}
.ta{border:1px solid var(--ai);border-radius:8px;padding:10px 12px;min-height:64px;line-height:18px;box-shadow:0 0 0 3px var(--aiT)}
.seg{display:flex;height:32px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#f3f3f3}
.seg span{flex:1;text-align:center;line-height:30px;border-left:1px solid var(--line)}.seg span:first-child{border:0}.seg .on{background:var(--yellow)}
.dc{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:16px 1fr;gap:12px;margin-bottom:12px}
.dc b{font:700 12px/16px M;display:block}.dc .p{color:var(--i50);margin-top:2px;line-height:16px}
.ok{color:#2f8f46;margin-top:6px;display:flex;align-items:center;gap:6px}.ok:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.er{color:var(--red);margin-top:6px}
.dc.bad{border-color:rgba(237,37,78,.35);background:rgba(237,37,78,.03)}
.bar{height:4px;border-radius:2px;background:var(--i5);margin-top:4px;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--teal)}
.pill{font:500 12px/24px M;color:#fff;background:var(--green);border-radius:12px;padding:0 10px}
</style></head><body>
<div class="abs sb"><div class="fix" style="top:352.7px;background:#12515a">Events</div><div class="fix" style="top:448.6px;background:var(--yellow);color:var(--ink)">User Workflows</div></div>
<div class="abs top"></div>
<div class="abs ib40" style="left:260px;top:72px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12130f" stroke-width="2"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></div>
<div class="abs crumb">Marketing<i>/</i>User Workflows</div>
<h1>Weekend win-back</h1>
<div class="abs ib40" style="left:1312px;top:72px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12130f" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></div>
<div class="abs ib40" style="left:1360px;top:72px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12130f" stroke-width="2"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg></div>
<div class="abs tabs"><span class="on">Flow</span><span>Settings</span><span>Reports</span></div>
<div class="abs sep"></div>
<div class="abs work"><div class="canvas" id="cv"></div><div class="panel" id="P"></div></div>
<div class="abs bb" id="BB"></div>
<script>
const S=new URLSearchParams(location.search).get('s')||'1';
const SPK=c=>`<svg class="spk" viewBox="0 0 16 16"><path d="M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z" fill="${c||'#a682ff'}"/><path d="M13 1.5l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z" fill="#ffbf00"/></svg>`;
const I={user:'<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="6" cy="4" r="2.2"/><path d="M2 11c.5-2.2 2-3.2 4-3.2s3.5 1 4 3.2"/></svg>',
 clock:'<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="6" cy="6" r="4.6"/><path d="M6 3.4V6l1.8 1.2"/></svg>',
 arrow:'<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.5"><path d="M1.5 6h8.5M7 3l3 3-3 3"/></svg>',
 split:'<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.4"><path d="M2 3h6l2 2M2 9h6l2-2M10 5V2.5M10 7v2.5"/></svg>'};
const node=(x,y,c,t,ic,rows,sel,tag)=>`<div class="node" style="left:${x}px;top:${y}px">${sel?`<div class="fb" style="top:-16px;background:${c}"></div>`:''}
<div class="h" style="background:${c}">${I[ic]}<span>${tag?`<span class="ab">${tag}</span> `:''}${t}</span></div>
${rows.map(r=>`<div class="r" style="border-color:${c}">${r}</div>`).join('')}
${sel?`<div class="fb" style="bottom:-16px;background:${c}"></div>`:''}</div>`;
const plus=(x,y)=>`<div class="plus" style="left:${x}px;top:${y}px"><svg width="12" height="12" viewBox="0 0 12 12" stroke="#12130f" stroke-width="1.5"><path d="M6 1v10M1 6h10"/></svg></div>`;
const Y=250;
const actRows={ '0':['Send Email','<span class="k">A/B test</span><br>1 variant'],'1':['Send Email','<span class="k">A/B test</span><br>3 variants'],'2':['Send Email','<span class="k">A/B test</span><br>3 drafts'],'e':['Send Email','<span class="k">A/B test</span><br>1 variant'],'f':['Send Email','<span class="k">A/B test</span><br>1 variant'],'g':['Send Email','<span class="k">A/B test</span><br>Drafting…'],'3':['Send Email','<span class="k">Winner</span><br>Variant 2']}[S];
document.getElementById('cv').innerHTML=
 node(40,Y,'var(--audience)','Audience','user',['Lapsed 30+ days'])+plus(196,Y+28)+
 node(232,Y,'var(--delay)','Delay','clock',['Fri, 05:00 PM'])+plus(388,Y+28)+
 node(424,Y,'var(--action)','Action','arrow',actRows,1,'A/B')+plus(580,Y+28)+
 node(616,Y,'var(--split)','Conditional split','split',['Has purchase'])+
 `<div class="abs ib40" style="right:12px;top:12px;background:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12130f" stroke-width="2"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></div>`;
const H2=(t,extra,right)=>`<div class="h2"><b>${t}${extra||''}</b>${right||'<span style="display:flex;gap:8px"><span class="ib40" style="width:32px;height:32px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg></span></span>'}</div>`;
const sel=(v,ph)=>`<div class="inp ${ph?'ph':''}">${v}<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#12130f" stroke-width="1.6"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></div>`;
const fld=(l,c)=>`<div><div class="lbl">${l}<span class="help">?</span></div>${c}</div>`;
const typeRow=`<div class="row f" style="align-items:flex-end">${fld('Type',sel('Send Email'))}<div class="cb" style="height:32px"><span class="cbx"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M2 5l2 2 4-4"/></svg></span>Enable A/B testing<span class="help">?</span></div></div>`;
const P=document.getElementById('P'),BB=document.getElementById('BB');
const B=(t,cls,ic,id)=>`<div class="b ${cls}" ${id?`id="${id}"`:''}>${ic}<span>${t}</span></div>`;
const icX='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#12130f" stroke-width="1.8"><path d="M3 3l10 10M13 3L3 13"/></svg>';
const icOk='<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="rgba(255,255,255,.25)"/><path d="M5.5 9l2.3 2.3L12.5 6.6" fill="none" stroke="#fff" stroke-width="1.8"/></svg>';
const icGo='<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 9h11M10 5l4 4-4 4"/></svg>';
const icRe='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#12130f" stroke-width="1.6"><path d="M13 8a5 5 0 11-1.5-3.5M13 2.5V5h-2.5"/></svg>';
if(S=='0'||S=='1'){const Z=S=='0';
 P.innerHTML=H2('Action')+typeRow+
 `<div class="sh"><b>A/B settings</b></div>`+
 (Z?'':`<div class="aic" style="margin-bottom:20px">${SPK()}<div><span class="t">Sweed AI tuned this test:</span> 30% of the segment, winner by orders in 5 hours. <span class="lk">Undo</span></div></div>`)+
 `<div class="row">${fld('Test audience, %',sel('30'))}${fld('Winning metric',sel('Order placed rate'))}</div>
  <div class="row f">${fld('Test duration',`<div class="row" style="gap:8px"><div class="inp">5</div>${sel('Hours')}</div>`)}${fld('After the test',sel('Send the winner'))}</div>
  <div class="sh"><b>Variants</b><span style="display:flex;gap:8px"><span class="btn aib" id="gen">${SPK('#fff')}Generate with Sweed AI</span><span class="btn">+ Add variant</span></span></div>
  <div class="tb"><div class="tr th" style="grid-template-columns:minmax(0,1fr) 48px"><span>Name</span><span>Share</span></div>
  <div class="tr" style="grid-template-columns:minmax(0,1fr) 48px"><span>Variant 1<span class="bd def">Default</span><span class="s">We miss you. Here's 20% off this weekend</span></span><span>${Z?'30%':'10%'}</span></div>
  ${Z?'':`<div class="tr" style="grid-template-columns:minmax(0,1fr) 48px"><span>Variant 2<span class="bd ai">Sweed AI</span><span class="s">Your Blue Dream is back in stock, 20% off till Sunday</span></span><span>10%</span></div>
  <div class="tr" style="grid-template-columns:minmax(0,1fr) 48px"><span>Variant 3<span class="bd ai">Sweed AI</span><span class="s">Last call: 20% off flower ends Sunday at 9 PM</span></span><span>10%</span></div>`}</div>`;
 BB.innerHTML=B('Cancel','g',icX)+B('Save','p',icOk)+B('Start test','p',icGo,'start');
}
if('2efg'.includes(S)){const E=S=='e',FIN=S=='g'||S=='2',HID=S!='2';
 P.innerHTML=H2('Generate variants',SPK(),`<span class="ib40" style="width:32px;height:32px">${icX}</span>`)+
 `<div class="f"><div class="lbl">What should this email do?</div><div class="ta" id="ta">${E?'':"Bring back customers who haven't ordered in 30 days. 20% off flower this weekend, pickup or delivery."}</div></div>
  <div class="row f">${fld('Vary','<div class="seg"><span>Subject</span><span>Content</span><span class="on">Both</span></div>')}${fld('Variants',sel('3'))}</div>
  <div id="drafts" style="${HID?'visibility:hidden':''}"><div class="sh" id="dh"><b>Drafts</b><span style="color:var(--i50)">Checked against California ad rules</span></div>
  <div class="dc"><span class="cbx"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M2 5l2 2 4-4"/></svg></span><div><b>Your Blue Dream is back in stock, 20% off till Sunday</b><div class="p">Built from each customer's last purchase.</div><div class="ok">Compliant</div></div></div>
  <div class="dc"><span class="cbx"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M2 5l2 2 4-4"/></svg></span><div><b>Last call: 20% off flower ends Sunday at 9 PM</b><div class="p">Deadline in the subject, one button to the deal.</div><div class="ok">Compliant</div></div></div>
  <div class="dc bad"><span class="cbx off"></span><div><b>Feel better this weekend with 20% off</b><div class="p">Lifestyle tone, bundle of three products.</div><div class="er">Health claim in the subject, not allowed in California. <span class="lk">Rewrite</span></div></div></div></div>`;
 BB.innerHTML=FIN?B('Regenerate','g',icRe)+B('Add 2 variants','p',icOk,'add'):B('Cancel','g',icX)+'<div class="b ai" id="genbtn">'+SPK('#fff')+'<span>Generate drafts</span></div>';
}
if(S=='3'){
 const r=(n,b,sub,op,or,w,win)=>`<div class="tr" style="grid-template-columns:minmax(0,1fr) 56px 96px;${win?'background:rgba(255,191,0,.12)':''}"><span>${n}${b}${win?'<span class="bd win">Winner</span>':''}<span class="s">${sub}</span></span><span>${op}</span><span>${or}<div class="bar"><i style="width:${w}%"></i></div></span></div>`;
 P.innerHTML=H2('Action')+typeRow+
 `<div class="sh"><b>Test results</b><span class="pill">Winner sent to 70%</span></div>
  <div class="tb"><div class="tr th" style="grid-template-columns:minmax(0,1fr) 56px 96px"><span>Variant · 412 sent each</span><span>Opened</span><span>Order placed</span></div>
  ${r('Variant 1','<span class="bd def">Default</span>',"We miss you. Here's 20% off this weekend",'17.2%','8.7%',33)}
  ${r('Variant 2','<span class="bd ai">Sweed AI</span>','Your Blue Dream is back in stock, 20% off till Sunday','22.6%','14.1%',54,1)}
  ${r('Variant 3','<span class="bd ai">Sweed AI</span>','Last call: 20% off flower ends Sunday at 9 PM','24.0%','10.4%',40)}</div>
  <div class="aic" style="margin-top:20px">${SPK()}<div><div class="t" style="margin-bottom:6px">Why Variant 2 won</div>Naming a product the customer already bought brought more orders than urgency. Variant 3 got the most opens but fewer orders: the subject pulled people in, the email didn't close.<div style="margin-top:12px;display:flex;gap:20px"><span class="lk">Test send time next</span><span class="lk">Reuse in win-back flows</span></div></div></div>`;
 BB.innerHTML=B('Duplicate test','g',icRe)+B('Open report','p',icGo);
}
</script></body></html>
