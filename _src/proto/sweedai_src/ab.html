<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:F;src:url(figtree-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:F;src:url(figtree-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:F;src:url(figtree-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:F;src:url(figtree-latin-700-normal.woff2);font-weight:700}
:root{--teal:#1f7a70;--tealT:#1c6f66;--lbl:#24786c;--ink:#151515;--mut:#8a8a8a;--line:#e2e2e2;--bg:#f3f3f3;--y:#ffbe00;
 --ai:#eef6f4;--aiB:#cbe3dd;--mag:#d100e6;--red:#e5484d}
*{box-sizing:border-box;margin:0;padding:0}
body{width:2000px;height:1248px;font-family:F,sans-serif;color:var(--ink);background:#fff;position:relative;overflow:hidden;font-size:18px}
.sb{position:absolute;left:0;top:0;width:305px;height:1248px;background:#06485f url(sidebar.png) no-repeat top left}
.sb .fix{position:absolute;left:0;width:305px;height:44px;font-size:18px;padding-left:67px;line-height:44px}
.top{position:absolute;left:305px;top:0;width:1695px;height:76px;background:#f3f3f3 url(topbar.png) no-repeat}
.main{position:absolute;left:361px;top:76px;right:56px;bottom:0}
.crumb{position:absolute;left:78px;top:20px;font-size:17px;color:#9a9a9a}.crumb b{font-weight:400;color:#3aa66a}
.back{position:absolute;left:0;top:24px;width:56px;height:56px;border-radius:8px;background:#f1f1f1;display:grid;place-items:center}
h1{position:absolute;left:78px;top:42px;font-size:34px;font-weight:700}
.tabs{position:absolute;left:0;top:102px;display:flex;background:#f1f1f1;border-radius:8px;border:1px solid #e6e6e6;overflow:hidden}
.tabs span{padding:9px 20px;font-size:19px}.tabs .on{background:var(--y)}
.hdiv{position:absolute;left:0;right:0;top:168px;height:6px;background:#f1f1f1;border-radius:3px}
.ticons{position:absolute;right:0;top:24px;display:flex;gap:12px}.ticons i{width:56px;height:56px;border-radius:8px;background:#f1f1f1;display:block}
.work{position:absolute;left:0;right:0;top:196px;bottom:20px;border:1px solid #ececec;border-radius:10px;overflow:hidden;display:flex}
.canvas{flex:1;background:var(--bg);position:relative}
.panel{width:800px;background:#fff;border-left:1px solid #ececec;padding:26px 30px;position:relative}
/* nodes */
.node{position:absolute;width:230px;background:#fff;border:2px solid;border-radius:8px;font-size:15px;overflow:hidden}
.node .nh{color:#fff;padding:6px 10px;display:flex;justify-content:space-between;font-weight:500}
.node .nb{padding:7px 10px;color:#8a8a8a;line-height:1.25}.node .nb b{display:block;font-weight:500;color:#222}
.wire{position:absolute;height:2px;background:#7cc49a}
.plus{position:absolute;width:30px;height:30px;border-radius:50%;background:#e7e7e7;display:grid;place-items:center;font-size:22px;color:#333}
.selbar{position:absolute;height:8px;background:var(--mag);border-radius:4px}
.abtag{position:absolute;font-size:13px;font-weight:600;color:#fff;background:var(--mag);padding:3px 8px;border-radius:5px}
/* panel */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ph h2{font-size:23px;font-weight:700}
.ib{width:40px;height:40px;border-radius:8px;background:#f1f1f1;display:inline-grid;place-items:center;margin-left:8px}
label{display:block;color:var(--lbl);font-size:16px;margin-bottom:6px}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#ececec;color:#555;font-size:11px;margin-left:6px;vertical-align:1px}
.in{height:46px;border:1px solid #dedede;border-radius:8px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;font-size:17px;background:#fff}
.chev{width:10px;height:10px;border-right:2px solid #888;border-bottom:2px solid #888;transform:rotate(45deg) translateY(-3px)}
.row{display:flex;gap:16px}.row>*{flex:1}
.cb{display:flex;align-items:center;gap:10px;color:var(--lbl);font-size:16px;padding-top:24px}
.cb i{width:20px;height:20px;border-radius:4px;background:var(--teal);display:grid;place-items:center;color:#fff;font-size:13px;font-style:normal}
h3{font-size:20px;font-weight:700;margin:22px 0 14px}
.slider{height:4px;background:#e4e4e4;border-radius:2px;position:relative;margin:16px 0 6px}
.slider b{position:absolute;left:0;top:0;height:4px;width:30%;background:var(--teal);border-radius:2px}
.slider i{position:absolute;left:30%;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--teal);margin-left:-10px}
.g{margin-bottom:14px}
.btn{height:44px;border-radius:8px;display:inline-flex;align-items:center;gap:10px;padding:0 18px;font-size:17px;font-weight:600;white-space:nowrap}
.b1{background:var(--teal);color:#fff}.b2{background:#f1f1f1;color:#222}.b3{border:1.5px solid var(--teal);color:var(--tealT);background:#fff}
.tbl{border-radius:8px;overflow:hidden;border:1px solid #eee;font-size:16px}
.tbl .tr{display:grid;align-items:center;padding:12px 16px;min-height:44px;gap:12px}
.tbl .th{background:#151515;color:#fff;min-height:40px;padding:9px 16px}
.tbl .tr:nth-child(odd):not(.th){background:#f7f7f7}
.chip{font-size:12px;font-weight:600;background:#e9e9e9;color:#555;border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.chip.ai{background:var(--ai);color:var(--tealT);border:1px solid var(--aiB)}
.sub{color:#777;font-size:14px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* AI */
.spark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--teal);flex:none}
.spark svg{width:16px;height:16px}
.aicard{background:var(--ai);border:1px solid var(--aiB);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.4}
.aicard .t{font-weight:600;color:var(--tealT)}
.aicard .lk{color:var(--tealT);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.foot{position:absolute;left:30px;right:30px;bottom:24px;display:flex;gap:16px}
.foot .btn{flex:1;justify-content:space-between;height:50px}
.seg{display:flex;border:1px solid #dedede;border-radius:8px;overflow:hidden;height:46px}
.seg span{flex:1;display:grid;place-items:center;font-size:16px;border-left:1px solid #dedede}.seg span:first-child{border:0}
.seg .on{background:var(--teal);color:#fff}
.ta{border:1.5px solid var(--teal);border-radius:8px;padding:12px 15px;font-size:17px;line-height:1.45;min-height:96px;box-shadow:0 0 0 4px #e3f1ee}
.vc{border:1px solid #e4e4e4;border-radius:10px;padding:13px 16px;margin-bottom:10px;display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start}
.vc .ck{width:20px;height:20px;border-radius:4px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:13px;margin-top:2px}
.vc .s{font-weight:600;font-size:17px}.vc .p{color:#6f6f6f;font-size:15px;margin-top:3px;line-height:1.35}
.ok{font-size:14px;color:#2b8a4e;display:flex;gap:6px;align-items:center;margin-top:7px}
.warn{font-size:14px;color:#b4232a;margin-top:7px;line-height:1.35}
.warn u{color:var(--tealT);font-weight:600;text-decoration:underline;text-underline-offset:3px;margin-left:6px}
.vc.flag{border-color:#f2c3c5;background:#fff8f8}
.vc.flag .ck{background:#fff;border:1.5px solid #c9c9c9}
.tag{font-size:13px;color:#777;white-space:nowrap}
.win{background:#fff6d6 !important}
.wb{font-size:12px;font-weight:700;background:var(--y);color:#3a2a00;border-radius:4px;padding:2px 7px;margin-left:8px}
.bar{height:8px;border-radius:4px;background:#e8e8e8;position:relative}.bar b{position:absolute;left:0;top:0;height:8px;border-radius:4px;background:var(--teal)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:#2b8a4e;background:#eaf6ee;border-radius:6px;padding:4px 10px}
</style></head><body>
<div class="sb">
 <div class="fix" style="top:489px;background:#12515a;color:#fff">Events</div>
 <div class="fix" style="top:622px;background:var(--y);color:#151515">User Workflows</div>
</div>
<div class="top"></div>
<div class="main">
 <div class="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></div>
 <div class="crumb">Marketing / <b>User Workflows</b></div>
 <h1>Weekend win-back</h1>
 <div class="tabs"><span class="on">Flow</span><span>Settings</span><span>Reports</span></div>
 <div class="ticons"><i style="display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></i><i style="display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg></i></div>
 <div class="hdiv"></div>
 <div class="work">
  <div class="canvas" id="cv"></div>
  <div class="panel" id="panel"></div>
 </div>
</div>
<template id="sparkT"><span class="spark"><svg viewBox="0 0 16 16"><path d="M8 0.8l1.7 4.6 4.7 1.7-4.7 1.7L8 15.4l-1.7-4.6L1.6 9.1l4.7-1.7z" fill="#ffbe00"/></svg></span></template>
<script>
const S=new URLSearchParams(location.search).get('s')||'1';
const spark=document.getElementById('sparkT').innerHTML;
// canvas
const cv=document.getElementById('cv');
const nodes=[
 {x:30,c:'#4caf50',t:'Audience',l:'Segments',v:'Lapsed 30+ days'},
 {x:300,c:'#16b4d6',t:'Delay',l:'Time',v:'Fri, 05:00 PM'},
 {x:570,c:'#d100e6',t:'Action',l:'Event type',v:'Send email',sel:1}];
let h='';const Y=330;
h+=`<div class="wire" style="left:0;width:770px;top:${Y+40}px"></div>`;
nodes.forEach((n,i)=>{
 h+=`<div class="node" style="left:${n.x}px;top:${Y}px;border-color:${n.c}"><div class="nh" style="background:${n.c}"><span>${n.t}</span></div><div class="nb">${n.l}<b>${n.v}</b></div>${n.sel?'<div class="nb">Variants<b>'+(S=='0'?'1 · A/B test':S=='1'?'3 · A/B test':S=='2'?'Drafting…':'Winner sent')+'</b></div>':''}</div>`;
 if(i)h+=`<div class="plus" style="left:${n.x-50}px;top:${Y+26}px">+</div>`;
 if(n.sel){h+=`<div class="selbar" style="left:${n.x}px;width:230px;top:${Y-22}px"></div><div class="selbar" style="left:${n.x}px;width:230px;top:${Y+160}px"></div>`;
  h+=`<div class="abtag" style="left:${n.x+150}px;top:${Y+6}px">A/B</div>`}
});
cv.innerHTML=h;
const P=document.getElementById('panel');
const head=`<div class="ph"><h2>Action</h2><div><span class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2"><path d="M5 3h11l3 3v15H5zM8 3v6h8V3M8 21v-7h8v7"/></svg></span><span class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg></span></div></div>`;
const typeRow=`<div class="row g"><div><label>Type<span class="q">?</span></label><div class="in">Send email<i class="chev"></i></div></div><div class="cb"><i>✓</i>Enable A/B testing<span class="q">?</span></div></div>`;
if(S=='1'||S=='0'){const Z=S=='0';
P.innerHTML=head+typeRow+`
<h3>A/B settings</h3>
${Z?'':`<div class="aicard g">${spark}<div><span class="t">Sweed AI tuned this test.</span> Your segment is 4,120 customers, so a 30% test group gives each variant enough sends to call a winner in 5 hours. Order placed rate fits a win-back goal better than opens. <span class="lk">Undo</span></div></div>`}
<div class="row g"><div><label>Test audience, %<span class="q">?</span></label><div class="in">30</div></div><div><label>Resulting audience, %<span class="q">?</span></label><div class="in" style="color:#888">70</div></div></div>
<div class="slider"><b></b><i></i></div>
<div class="row g" style="margin-top:18px"><div><label>Winning metric<span class="q">?</span></label><div class="in">Order placed rate<i class="chev"></i></div></div><div><label>Test duration<span class="q">?</span></label><div class="row" style="gap:10px"><div class="in">5</div><div class="in">hours<i class="chev"></i></div></div></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px"><h3 style="margin:0">Variants</h3><div style="display:flex;gap:10px"><span class="btn b3" id="gen">${spark.replace('class="spark"','class="spark" style="width:22px;height:22px"')}Generate with Sweed AI</span><span class="btn b2">+ Add variant</span></div></div>
<div class="tbl"><div class="tr th" style="grid-template-columns:1fr 70px"><span>Name</span><span>Share</span></div>
<div class="tr" style="grid-template-columns:1fr 70px"><span>Variant 1<span class="chip">DEFAULT</span><span class="sub">We miss you. Here's 20% off this weekend</span></span><span>${Z?'30%':'10%'}</span></div>
${Z?'':`<div class="tr" style="grid-template-columns:1fr 70px"><span>Variant 2<span class="chip ai">Sweed AI</span><span class="sub">Your Blue Dream is back in stock, 20% off till Sunday</span></span><span>10%</span></div>
<div class="tr" style="grid-template-columns:1fr 70px"><span>Variant 3<span class="chip ai">Sweed AI</span><span class="sub">Last call: 20% off flower ends Sunday at 9 PM</span></span><span>10%</span></div>`}</div>
<div class="foot"><span class="btn b2">Reset</span><span class="btn b1" id="start">Start test<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span></div>`;
}
if(S=='2'){
P.innerHTML=`<div class="ph"><h2 style="display:flex;align-items:center;gap:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>${spark}Generate variants</h2><span class="tag">Uses this segment, store catalog and active promos</span></div>
<div class="g"><label>What should this email do?</label><div class="ta">Bring back customers who haven't ordered in 30 days. 20% off flower this weekend, pickup or delivery.</div></div>
<div class="row g"><div><label>Vary</label><div class="seg"><span>Subject</span><span>Content</span><span class="on">Both</span></div></div><div><label>Number of variants</label><div class="in">3<i class="chev"></i></div></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px"><h3 style="margin:0">Drafts</h3><span class="tag">Checked against California ad rules</span></div>
<div class="vc"><span class="ck">✓</span><div><div class="s">Your Blue Dream is back in stock, 20% off till Sunday</div><div class="p">Picked from the last purchase of each customer. Product block: 4 items in stock at their store.</div><div class="ok">● Compliant</div></div><span class="tag">Content + subject</span></div>
<div class="vc"><span class="ck">✓</span><div><div class="s">Last call: 20% off flower ends Sunday at 9 PM</div><div class="p">Deadline in the subject, short body with one button to the deal.</div><div class="ok">● Compliant</div></div><span class="tag">Subject</span></div>
<div class="vc flag"><span class="ck"></span><div><div class="s">Feel better this weekend with 20% off</div><div class="p">Friendly tone, lifestyle image, bundle of three products.</div><div class="warn">Health claim in the subject. Not allowed in cannabis ads in California.<u>Rewrite</u></div></div><span class="tag">Content + subject</span></div>
<div class="foot"><span class="btn b2">Regenerate</span><span class="btn b1" id="add">Add 2 variants to test<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span></div>`;
}
if(S=='3'){
const r=(n,chip,sub,sent,op,or,w,win)=>`<div class="tr ${win?'win':''}" style="grid-template-columns:1fr 80px 90px 170px"><span>${n}${chip}${win?'<span class="wb">Winner</span>':''}<span class="sub">${sub}</span></span><span>${sent}</span><span>${op}</span><span style="display:grid;gap:5px">${or}<span class="bar"><b style="width:${w}%"></b></span></span></div>`;
P.innerHTML=head+typeRow+`
<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 14px"><h3 style="margin:0">Test results</h3><span class="status">● Winner sent to 70% · Fri 10:05 PM</span></div>
<div class="tbl g"><div class="tr th" style="grid-template-columns:1fr 80px 90px 170px"><span>Variant</span><span>Sent</span><span>Opened</span><span>Order placed</span></div>
${r('Variant 1','<span class="chip">DEFAULT</span>','We miss you. Here\'s 20% off this weekend','412','17.2%','8.7%',33)}
${r('Variant 2','<span class="chip ai">Sweed AI</span>','Your Blue Dream is back in stock, 20% off till Sunday','412','22.6%','14.1%',54,1)}
${r('Variant 3','<span class="chip ai">Sweed AI</span>','Last call: 20% off flower ends Sunday at 9 PM','412','24.0%','10.4%',40)}
</div>
<div class="aicard" style="margin-top:18px">${spark}<div><div class="t" style="margin-bottom:6px">Why Variant 2 won</div>Naming the product a customer already bought brought more orders than urgency. Variant 3 got the most opens but fewer orders, so the subject line pulled people in and the email body didn't close.<div style="margin-top:12px;display:flex;gap:18px"><span class="lk">Test send time next</span><span class="lk">Use this subject in other win-back flows</span></div></div></div>
<div class="foot"><span class="btn b2">Duplicate test</span><span class="btn b1">Open report<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span></div>`;
}
</script></body></html>
