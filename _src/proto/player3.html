<!doctype html><meta charset="utf-8"><title>proto</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=block">
<style>
html,body{margin:0;height:100%;background:#ecebe8;overflow:hidden;cursor:none}
#st{position:relative;width:100vw;height:100vh}

.s{position:absolute;inset:0}
.s img,.b img{width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}

.b{position:fixed;inset:0;z-index:1000;pointer-events:none}
#hd{position:fixed;inset:0;z-index:900;pointer-events:none;clip-path:inset(0 0 93.65% 15.25%)}
#hd img{width:100%;height:100%;display:block}
.b img{clip-path:inset(0 84.75% 0 0)}
.h{position:absolute;cursor:none;pointer-events:auto}
.h.c:hover{background:rgba(0,0,0,.07)}
.h.d:hover{background:rgba(255,255,255,.10)}
body.dbg .h{outline:2px solid red;background:rgba(255,0,0,.12)}
#cur{position:fixed;left:0;top:0;width:36px;height:36px;pointer-events:none;z-index:2000;transform:translate(-100px,-100px);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#rp{position:fixed;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:3px solid #1a1a1a;opacity:0;pointer-events:none;z-index:1500}
#rp.go{animation:rp .5s ease-out}
@keyframes rp{from{opacity:.8;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
#nda{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;pointer-events:none;-webkit-backdrop-filter:blur(var(--b,0px));backdrop-filter:blur(var(--b,0px));background:rgba(236,235,232,var(--a,0))}
#nda p{display:inline-flex;align-items:center;gap:.7em;margin:0;padding:.7em 1.2em;font:500 28px/1.5 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.04em;color:#111;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),0 8px 30px rgba(0,0,0,.06);opacity:var(--o,0);transform:translateY(calc((1 - var(--o,0))*10px))}
#nda p::before{content:"";width:.6em;height:.5em;margin-top:.3em;border:3px solid currentColor;border-radius:2px;box-shadow:0 -.36em 0 -.06em rgba(255,255,255,.9),0 -.36em 0 0 currentColor}
</style>
<div id="st"></div><div id="bw"></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L16 20l-3 1.4-3.5-7.5L4 18z" fill="#1a1a1a" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div id="rp"></div><div id="nda"><p>Protected by NDA</p></div>
<script>
const q=new URLSearchParams(location.search);
if(q.get("dbg"))document.body.classList.add("dbg");
fetch(q.get("cfg")).then(r=>r.json()).then(init);
let IH=1197;function pct(b){return `left:${b[0]/20}%;top:${b[1]/(IH/100)}%;width:${(b[2]-b[0])/20}%;height:${(b[3]-b[1])/(IH/100)}%;${b[4]?"border-radius:"+b[4]:""}`}
const C={},B={};
function init(cfg){IH=cfg.h||1197;const P=cfg.img||'sweed';
 cfg.screens.forEach(n=>{
  const c=document.createElement("div");c.className="s";c.id="s-"+n;c.innerHTML=`<img src="img/${P}-${n}.jpg">`;document.getElementById("st").appendChild(c);C[n]=c;
  
 });
 cfg.hs.forEach(h=>{
  const e=document.createElement("div");e.className="h "+(h.plain?"":(h.sb?"d":"c"));e.id=h.id;e.style.cssText=pct(h.box);
  if(h.hov){const hi=document.createElement("img");hi.src=`img/${P}-${h.hov}.jpg`;hi.style.cssText="position:absolute;inset:0;width:100%;height:100%;display:block;visibility:hidden";C[h.s].insertBefore(hi,C[h.s].firstChild.nextSibling);e.addEventListener("mouseenter",()=>hi.style.visibility="visible");e.addEventListener("mouseleave",()=>hi.style.visibility="hidden")}
  e.onclick=()=>go(h.to);(h.sb?B[h.s]:C[h.s]).appendChild(e);
 });
 let z=1;
 window.go=function(k){C[k].style.zIndex=++z};
 go(q.get("show")||cfg.start);
 Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>{window.ready=1});
}
const cur=document.getElementById("cur"),rp=document.getElementById("rp");
addEventListener("mousemove",e=>{cur.style.transform=`translate(${e.clientX-5}px,${e.clientY-3}px)`});
window.setNda=p=>{const n=document.getElementById('nda');n.style.setProperty('--b',(26*p)+'px');n.style.setProperty('--a',(.22*p).toFixed(3));n.style.setProperty('--o',Math.max(0,Math.min(1,(p-.3)/.7)).toFixed(3));document.getElementById('cur').style.opacity=String(1-Math.min(1,p*2))};
window.setRipple=(x,y,p)=>{if(p<0||p>1){rp.style.opacity=0;return}rp.style.left=x+"px";rp.style.top=y+"px";rp.style.opacity=.8*(1-p);rp.style.transform=`scale(${.3+1.3*p})`};
addEventListener("mousedown",e=>{rp.style.left=e.clientX+"px";rp.style.top=e.clientY+"px";rp.classList.remove("go");void rp.offsetWidth;rp.classList.add("go")});
</script>
